<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Planner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e0ddd8;font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:13px;min-height:100vh}

.s-國文{color:#e06c75}.bg-國文{background:rgba(224,108,117,.15);border-left:3px solid #e06c75}
.s-英語{color:#e5c07b}.bg-英語{background:rgba(229,192,123,.15);border-left:3px solid #e5c07b}
.s-數學{color:#61afef}.bg-數學{background:rgba(97,175,239,.15);border-left:3px solid #61afef}
.s-理化{color:#56b6c2}.bg-理化{background:rgba(86,182,194,.15);border-left:3px solid #56b6c2}
.s-歷史{color:#c678dd}.bg-歷史{background:rgba(198,120,221,.15);border-left:3px solid #1c678dd}
.s-地理{color:#98c379}.bg-地理{background:rgba(152,195,121,.15);border-left:3px solid #98c379}
.s-公民{color:#d19a66}.bg-公民{background:rgba(209,154,102,.15);border-left:3px solid #d19a66}
.s-Reading{color:#abb2bf}.bg-Reading{background:rgba(171,178,191,.15);border-left:3px solid #abb2bf}

#summary{background:#161616;border-bottom:1px solid #2a2a2a;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:100}
.stat{background:#1e1e1e;border:1px solid #2e2e2e;border-radius:6px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;min-width:90px}
.stat-label{font-size:10px;color:#666;letter-spacing:.5px;text-transform:uppercase}
.stat-value{font-size:16px;font-weight:600;margin-top:2px}
.stat-value.purple{color:#c678dd}.stat-value.green{color:#98c379}.stat-value.blue{color:#61afef}.stat-value.amber{color:#e5c07b}.stat-value.red{color:#e06c75}
.prog-wrap{flex:1;min-width:120px}
.prog-bar-bg{background:#2a2a2a;border-radius:4px;height:8px;overflow:hidden}
.prog-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#c678dd,#61afef);transition:width .4s}
.prog-label{font-size:10px;color:#666;margin-bottom:4px}

#app{display:flex;height:calc(100vh - 57px)}
#sidebar{width:200px;background:#111;border-right:1px solid #1e1e1e;padding:12px 8px;overflow-y:auto;flex-shrink:0}
.sidebar-title{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px;padding:4px 8px 8px}
.subj-btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:5px;border:none;background:transparent;color:#999;cursor:pointer;font-family:inherit;font-size:12px;text-align:left;transition:background .15s}
.subj-btn:hover{background:#1a1a1a}
.subj-btn.active{background:#1e1e1e;color:#e0ddd8}
.subj-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.subj-count{margin-left:auto;font-size:10px;color:#555}

#main{flex:1;overflow-y:auto;padding:0}

#toolbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid #1e1e1e;background:#0d0d0d;position:sticky;top:0;z-index:50}
#search-box{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:5px;color:#ccc;padding:5px 10px;font-family:inherit;font-size:12px;outline:none}
#search-box:focus{border-color:#c678dd}
#add-btn{background:#c678dd22;border:1px solid #c678dd66;border-radius:5px;color:#c678dd;padding:5px 14px;font-family:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
#add-btn:hover{background:#c678dd33}

/* ── Custom dropdown ── */
.dd{position:relative;display:inline-block;user-select:none}
.dd-trigger{display:flex;align-items:center;gap:6px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:5px;padding:4px 8px;cursor:pointer;font-family:inherit;font-size:12px;white-space:nowrap;min-width:80px;transition:border-color .15s}
.dd-trigger:hover{border-color:#444}
.dd-trigger.open{border-color:#c678dd66}
.dd-arrow{margin-left:auto;font-size:9px;color:#555;transition:transform .15s}
.dd-trigger.open .dd-arrow{transform:rotate(180deg)}
.dd-menu{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;background:#1e1e1e;border:1px solid #333;border-radius:7px;padding:4px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.dd-menu.right{right:0;left:auto}
.dd-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:5px;cursor:pointer;font-size:12px;color:#ccc;white-space:nowrap;transition:background .1s}
.dd-item:hover{background:#2a2a2a;color:#e0ddd8}
.dd-item.selected{color:#e0ddd8}
.dd-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dd-divider{height:1px;background:#2a2a2a;margin:3px 4px}

/* Status pill styles inside trigger */
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:4px;font-size:11px}
.pill.未開始{background:#1e1e1e;color:#888;border:1px solid #333}
.pill.進行中{background:#e5c07b18;color:#e5c07b;border:1px solid #e5c07b33}
.pill.已完成{background:#98c37918;color:#98c379;border:1px solid #98c37933}
.pill.取消{background:#e06c7511;color:#e06c75;border:1px solid #e06c7522}

/* Score pill */
.sc-pill{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px}
.sc-high{background:#98c37918;color:#98c379;border:1px solid #98c37933}
.sc-mid{background:#61afef18;color:#61afef;border:1px solid #61afef33}
.sc-low{background:#e5c07b18;color:#e5c07b;border:1px solid #e5c07b33}
.sc-none{background:#1a1a1a;color:#555;border:1px solid #2a2a2a}

#task-table{width:100%;border-collapse:collapse}
#task-table thead th{background:#111;color:#555;font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:8px 10px;text-align:left;border-bottom:1px solid #1e1e1e;position:sticky;top:41px;z-index:40;white-space:nowrap}
.task-row{border-bottom:1px solid #161616;transition:background .1s}
.task-row:hover{background:#141414}
.task-row td{padding:5px 10px;vertical-align:middle}

/* Fix transparency for dropdowns in completed rows */
.task-row.done td:not(:has(.dd)){opacity:.55}
.task-row.cancelled td:not(:has(.dd)){opacity:.35;text-decoration:line-through}

.subj-tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px}
.task-name{font-size:15px;color:#d4d0c8}
.time-cell{color:#888;font-size:13px}
.task-row.pending td{color:#e0ddd8}
.task-row.pending .task-name{color:#f0ede6;font-weight:500}
.task-row.pending .subj-tag{filter:brightness(1.15)}
.act-btn{background:none;border:none;color:#444;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:3px}
.act-btn:hover{color:#e06c75;background:#e06c7511}
.edit-btn:hover{color:#61afef;background:#61afef11}

/* Modal */
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}
#modal-bg.open{display:flex}
#modal{background:#161616;border:1px solid #2e2e2e;border-radius:10px;padding:20px;width:420px;max-width:95vw}
#modal h3{color:#c678dd;font-size:14px;margin-bottom:16px;letter-spacing:.5px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:11px;color:#666;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-row input,.form-row textarea{width:100%;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:5px;color:#d4d0c8;padding:7px 10px;font-family:inherit;font-size:13px;outline:none}
.form-row input:focus,.form-row textarea:focus{border-color:#c678dd66}
.form-row textarea{resize:vertical;min-height:60px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn-cancel{background:#1e1e1e;border:1px solid #2e2e2e;color:#888;padding:7px 16px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px}
.btn-save{background:#c678dd22;border:1px solid #c678dd66;color:#c678dd;padding:7px 16px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px}
.btn-cancel:hover{background:#252525}
.btn-save:hover{background:#c678dd33}
.form-row .dd{width:100%}
.form-row .dd-trigger{width:100%}

#notes-section{padding:12px 14px;border-top:1px solid #1e1e1e}
#notes-section h4{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
#notes-area{width:100%;background:#111;border:1px solid #1e1e1e;border-radius:6px;color:#d4d0c8;padding:10px;font-family:inherit;font-size:12px;resize:vertical;min-height:80px;outline:none;line-height:1.6}
#notes-area:focus{border-color:#c678dd44}
#estimator{background:#111;border:1px solid #1e1e1e;border-radius:6px;padding:10px 14px;margin:12px 14px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.est-item{font-size:12px;color:#777}
.est-item span{color:#e5c07b;font-weight:600}
.empty{text-align:center;padding:40px;color:#444;font-size:13px}
</style>
</head>
<body>

<div id="summary">
  <div class="stat"><div class="stat-label">完成</div><div class="stat-value purple" id="s-done">0/0</div></div>
  <div class="stat"><div class="stat-label">完成率</div><div class="stat-value green" id="s-pct">0%</div></div>
  <div class="stat"><div class="stat-label">平均成績</div><div class="stat-value blue" id="s-avg">—</div></div>
  <div class="stat"><div class="stat-label">已花時間</div><div class="stat-value amber" id="s-spent">0 min</div></div>
  <div class="stat"><div class="stat-label">剩餘時間</div><div class="stat-value red" id="s-left">0 min</div></div>
  <div class="prog-wrap">
    <div class="prog-label" id="prog-label">整體進度</div>
    <div class="prog-bar-bg"><div class="prog-bar-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div class="sidebar-title">科目</div>
    <div id="subj-list"></div>
  </div>
  <div id="main">
    <div id="toolbar">
      <div class="dd" id="dd-filter">
        <div class="dd-trigger" id="dd-filter-trigger">
          <span id="dd-filter-label">全部狀態</span>
          <span class="dd-arrow">▼</span>
        </div>
        <div class="dd-menu" id="dd-filter-menu" style="display:none">
          <div class="dd-item selected" data-v="">全部狀態</div>
          <div class="dd-divider"></div>
          <div class="dd-item" data-v="未開始"><span class="dot" style="background:#555"></span><span class="pill 未開始">未開始</span></div>
          <div class="dd-item" data-v="進行中"><span class="dot" style="background:#e5c07b"></span><span class="pill 進行中">進行中</span></div>
          <div class="dd-item" data-v="已完成"><span class="dot" style="background:#98c379"></span><span class="pill 已完成">已完成</span></div>
          <div class="dd-item" data-v="取消"><span class="dot" style="background:#e06c75"></span><span class="pill 取消">取消</span></div>
        </div>
      </div>
      <input id="search-box" placeholder="搜尋任務…" />
      <button id="add-btn">+ 新增任務</button>
    </div>
    <table id="task-table">
      <thead>
        <tr>
          <th style="width:80px">科目</th>
          <th>任務</th>
          <th style="width:70px">預計(min)</th>
          <th style="width:110px">狀態</th>
          <th style="width:85px">成績</th>
          <th style="width:70px">實際(min)</th>
          <th>備註</th>
          <th style="width:50px"></th>
        </tr>
      </thead>
      <tbody id="task-body"></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none">目前沒有任務</div>
    <div id="estimator">
      <div class="est-item">未完成任務：<span id="est-tasks">0</span> 項</div>
      <div class="est-item">預計還需：<span id="est-time">0</span> 分鐘</div>
      <div class="est-item">≈ <span id="est-hrs">0</span> 小時</div>
    </div>
    <div id="notes-section">
      <h4>筆記</h4>
      <textarea id="notes-area" placeholder="在這裡記下重要筆記、提醒或想法…"></textarea>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal-bg">
  <div id="modal">
    <h3 id="modal-title">// 新增任務</h3>
    <div class="form-grid">
      <div class="form-row">
        <label>科目</label>
        <div class="dd" id="dd-msubj">
          <div class="dd-trigger" id="dd-msubj-trigger"><span id="dd-msubj-label" class="s-國文">[國文]</span><span class="dd-arrow" style="margin-left:auto">▼</span></div>
          <div class="dd-menu" id="dd-msubj-menu" style="display:none"></div>
        </div>
      </div>
      <div class="form-row">
        <label>狀態</label>
        <div class="dd" id="dd-mstatus">
          <div class="dd-trigger" id="dd-mstatus-trigger"><span class="pill 未開始" id="dd-mstatus-label">未開始</span><span class="dd-arrow" style="margin-left:auto">▼</span></div>
          <div class="dd-menu" id="dd-mstatus-menu" style="display:none">
            <div class="dd-item" data-v="未開始"><span class="pill 未開始">未開始</span></div>
            <div class="dd-item" data-v="進行中"><span class="pill 進行中">進行中</span></div>
            <div class="dd-item" data-v="已完成"><span class="pill 已完成">已完成</span></div>
            <div class="dd-item" data-v="取消"><span class="pill 取消">取消</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="form-row"><label>任務名稱</label><input id="f-name" placeholder="例：課文複習" /></div>
    <div class="form-grid">
      <div class="form-row"><label>預計時間 (min)</label><input id="f-est" type="number" min="0" placeholder="30" /></div>
      <div class="form-row"><label>實際時間 (min)</label><input id="f-actual" type="number" min="0" placeholder="0" /></div>
    </div>
    <div class="form-row" style="max-width:48%">
      <label>成績 (%)</label>
      <div class="dd" id="dd-mscore">
        <div class="dd-trigger" id="dd-mscore-trigger"><span class="sc-pill sc-none" id="dd-mscore-label">—</span><span class="dd-arrow" style="margin-left:auto">▼</span></div>
        <div class="dd-menu" id="dd-mscore-menu" style="display:none">
          <div class="dd-item" data-v=""><span class="sc-pill sc-none">—</span></div>
          <div class="dd-divider"></div>
          <div class="dd-item" data-v="95%"><span class="sc-pill sc-high">95%</span></div>
          <div class="dd-item" data-v="90%"><span class="sc-pill sc-high">90%</span></div>
          <div class="dd-item" data-v="85%"><span class="sc-pill sc-mid">85%</span></div>
          <div class="dd-item" data-v="80%"><span class="sc-pill sc-mid">80%</span></div>
          <div class="dd-item" data-v="75%"><span class="sc-pill sc-low">75%</span></div>
          <div class="dd-item" data-v="70%"><span class="sc-pill sc-low">70%</span></div>
          <div class="dd-item" data-v="65%"><span class="sc-pill sc-low">65%</span></div>
          <div class="dd-item" data-v="60%"><span class="sc-pill sc-low">60%</span></div>
        </div>
      </div>
    </div>
    <div class="form-row"><label>備註</label><textarea id="f-note" placeholder="選填備註…"></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">取消</button>
      <button class="btn-save" id="modal-save">儲存</button>
    </div>
  </div>
</div>

<script>
const SUBJECTS = ['國文','英語','數學','理化','歷史','地理','公民','Reading'];
const SUBJ_COLORS = {'國文':'#e06c75','英語':'#e5c07b','數學':'#61afef','理化':'#56b6c2','歷史':'#c678dd','地理':'#98c379','公民':'#d19a66','Reading':'#abb2bf'};
const SCORES = ['95%','90%','85%','80%','75%','70%','65%','60%'];
const STATUS_LIST = ['未開始','進行中','已完成','取消'];

let tasks = [];
let notes = '';
let filterSubj='', filterStatus='', searchQ='', editId=null;

let mSubj='國文', mStatus='未開始', mScore='';

function defaultTasks(){
  return [];
}

// ── Server Sync ──
async function initData() {
  try {
    const res = await fetch('/api/data');
    const data = await res.json();
    if (data.tasks && data.tasks.length > 0) {
      tasks = data.tasks;
    } else {
      tasks = defaultTasks();
    }
    notes = data.notes || '';
    document.getElementById('notes-area').value = notes;
    render();
  } catch (err) {
    console.error("Failed to load from Pi:", err);
    tasks = defaultTasks();
    render();
  }
}

async function save() {
  try {
    await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tasks: tasks, notes: notes })
    });
  } catch (err) {
    console.error("Failed to save to Pi:", err);
  }
}

function makeDD(triggerId, menuId, onChange){
  const trigger=document.getElementById(triggerId);
  const menu=document.getElementById(menuId);
  trigger.addEventListener('click',e=>{e.stopPropagation();const isOpen=menu.style.display==='block';closeAllDD(null);if(!isOpen){menu.style.display='block';trigger.classList.add('open');}});
  menu.querySelectorAll('.dd-item').forEach(item=>{
    item.addEventListener('click',e=>{
      e.stopPropagation();
      menu.querySelectorAll('.dd-item').forEach(i=>i.classList.remove('selected'));
      item.classList.add('selected');
      onChange(item.dataset.v, item);
      menu.style.display='none';trigger.classList.remove('open');
    });
  });
}
function closeAllDD(exceptMenu){
  document.querySelectorAll('.dd-menu').forEach(m=>{if(m!==exceptMenu){m.style.display='none';}});
  document.querySelectorAll('.dd-trigger').forEach(t=>t.classList.remove('open'));
}
document.addEventListener('click',()=>closeAllDD(null));

makeDD('dd-filter-trigger','dd-filter-menu',(v,item)=>{
  filterStatus=v;
  document.getElementById('dd-filter-label').innerHTML = v ? item.querySelector('.pill').outerHTML : '全部狀態';
  render();
});

function scoreClass(s){
  if(!s)return'sc-none';
  const n=parseInt(s);
  return n>=90?'sc-high':n>=80?'sc-mid':'sc-low';
}

function buildRowDD(type, taskId, currentVal){
  const uid=`dd-${type}-${taskId}`;
  let items='';
  if(type==='status'){
    items=STATUS_LIST.map(s=>`<div class="dd-item${s===currentVal?' selected':''}" data-v="${s}"><span class="pill ${s}">${s}</span></div>`).join('');
  } else {
    items=`<div class="dd-item${!currentVal?' selected':''}" data-v=""><span class="sc-pill sc-none">—</span></div><div class="dd-divider"></div>`
      +SCORES.map(s=>`<div class="dd-item${s===currentVal?' selected':''}" data-v="${s}"><span class="sc-pill ${scoreClass(s)}">${s}</span></div>`).join('');
  }
  const triggerContent = type==='status'
    ? `<span class="pill ${currentVal}">${currentVal}</span><span class="dd-arrow" style="margin-left:auto;font-size:9px;color:#555">▼</span>`
    : `<span class="sc-pill ${scoreClass(currentVal)}">${currentVal||'—'}</span><span class="dd-arrow" style="margin-left:auto;font-size:9px;color:#555">▼</span>`;
  return `<div class="dd" id="${uid}">
    <div class="dd-trigger" id="${uid}-t" style="min-width:0">${triggerContent}</div>
    <div class="dd-menu${type==='score'?' right':''}" id="${uid}-m" style="display:none">${items}</div>
  </div>`;
}

function attachRowDDs(){
  document.querySelectorAll('[data-rowdd]').forEach(el=>{
    const [type,id]=el.dataset.rowdd.split('-');
    const uid=`dd-${type}-${id}`;
    const trigger=document.getElementById(`${uid}-t`);
    const menu=document.getElementById(`${uid}-m`);
    if(!trigger||!menu)return;
    trigger.addEventListener('click',e=>{e.stopPropagation();const isOpen=menu.style.display==='block';closeAllDD(null);if(!isOpen){menu.style.display='block';trigger.classList.add('open');}});
    menu.querySelectorAll('.dd-item').forEach(item=>{
      item.addEventListener('click',e=>{
        e.stopPropagation();
        const v=item.dataset.v;
        const taskId=parseInt(id);
        if(type==='status'){changeStatus(taskId,v);} else {changeScore(taskId,v);}
        menu.style.display='none';trigger.classList.remove('open');
      });
    });
  });
}

(()=>{
  const menu=document.getElementById('dd-msubj-menu');
  menu.innerHTML=SUBJECTS.map(s=>`<div class="dd-item" data-v="${s}"><span class="dot" style="background:${SUBJ_COLORS[s]}"></span><span class="s-${s}">[${s}]</span></div>`).join('');
  makeDD('dd-msubj-trigger','dd-msubj-menu',(v,item)=>{
    mSubj=v;
    document.getElementById('dd-msubj-label').className=`s-${v}`;
    document.getElementById('dd-msubj-label').textContent=`[${v}]`;
  });
})();
makeDD('dd-mstatus-trigger','dd-mstatus-menu',(v)=>{
  mStatus=v;
  const lbl=document.getElementById('dd-mstatus-label');
  lbl.className=`pill ${v}`;lbl.textContent=v;
});
makeDD('dd-mscore-trigger','dd-mscore-menu',(v)=>{
  mScore=v;
  const lbl=document.getElementById('dd-mscore-label');
  lbl.className=`sc-pill ${scoreClass(v)}`;lbl.textContent=v||'—';
});

function setModalDD(ddId, val){
  const menu=document.getElementById(ddId+'-menu');
  if(!menu)return;
  menu.querySelectorAll('.dd-item').forEach(i=>{i.classList.toggle('selected',i.dataset.v===val);});
}
function setModalSubj(v){
  mSubj=v;
  const lbl=document.getElementById('dd-msubj-label');
  lbl.className=`s-${v}`;lbl.textContent=`[${v}]`;
  setModalDD('dd-msubj',v);
}
function setModalStatus(v){
  mStatus=v;
  const lbl=document.getElementById('dd-mstatus-label');
  lbl.className=`pill ${v}`;lbl.textContent=v;
  setModalDD('dd-mstatus',v);
}
function setModalScore(v){
  mScore=v;
  const lbl=document.getElementById('dd-mscore-label');
  lbl.className=`sc-pill ${scoreClass(v)}`;lbl.textContent=v||'—';
  setModalDD('dd-mscore',v);
}

function render(){
  save(); 
  renderSummary();
  renderSidebar();
  renderTable();
  renderEstimator();
}

function renderSummary(){
  const active=tasks.filter(t=>t.status!=='取消');
  const done=active.filter(t=>t.status==='已完成');
  const pct=active.length?Math.round(done.length/active.length*100):0;
  const scores=done.filter(t=>t.score).map(t=>parseInt(t.score));
  const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;
  const spent=tasks.filter(t=>t.actual>0).reduce((a,t)=>a+t.actual,0);
  const left=active.filter(t=>t.status!=='已完成').reduce((a,t)=>a+t.est,0);
  document.getElementById('s-done').textContent=`${done.length}/${active.length}`;
  document.getElementById('s-pct').textContent=pct+'%';
  document.getElementById('s-avg').textContent=avg?avg+'%':'—';
  document.getElementById('s-spent').textContent=spent>=60?(spent/60).toFixed(1)+' hr':spent+' min';
  document.getElementById('s-left').textContent=left>=60?(left/60).toFixed(1)+' hr':left+' min';
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-label').textContent=`整體進度 ${pct}%`;
}

function renderSidebar(){
  const html=['<button class="subj-btn'+(filterSubj===''?' active':'')+'" data-s=""><span class="subj-dot" style="background:#555"></span>全部<span class="subj-count">'+tasks.length+'</span></button>'];
  SUBJECTS.forEach(s=>{
    const cnt=tasks.filter(t=>t.subj===s).length;
    html.push(`<button class="subj-btn${filterSubj===s?' active':''}" data-s="${s}"><span class="subj-dot" style="background:${SUBJ_COLORS[s]}"></span>${s}<span class="subj-count">${cnt}</span></button>`);
  });
  document.getElementById('subj-list').innerHTML=html.join('');
  document.querySelectorAll('.subj-btn').forEach(b=>b.onclick=()=>{filterSubj=b.dataset.s;render();});
}

function renderTable(){
  let rows=tasks.filter(t=>{
    if(filterSubj&&t.subj!==filterSubj)return false;
    if(filterStatus&&t.status!==filterStatus)return false;
    if(searchQ&&!(t.name.toLowerCase().includes(searchQ)||t.subj.toLowerCase().includes(searchQ)||t.note.toLowerCase().includes(searchQ)))return false;
    return true;
  });
  const empty=document.getElementById('empty-msg');
  if(!rows.length){empty.style.display='block';document.getElementById('task-body').innerHTML='';return;}
  empty.style.display='none';
  document.getElementById('task-body').innerHTML=rows.map(t=>`
    <tr class="task-row${t.status==='已完成'?' done':t.status==='取消'?' cancelled':''}" data-id="${t.id}">
      <td><span class="subj-tag s-${t.subj}">[${t.subj}]</span></td>
      <td class="task-name">${t.name}</td>
      <td class="time-cell">${t.est}</td>
      <td><div data-rowdd="status-${t.id}">${buildRowDD('status',t.id,t.status)}</div></td>
      <td><div data-rowdd="score-${t.id}">${buildRowDD('score',t.id,t.score)}</div></td>
      <td class="time-cell">${t.actual||0}</td>
      <td style="color:#666;font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${t.note}">${t.note||''}</td>
      <td>
        <button class="act-btn edit-btn" onclick="openEdit(${t.id})">✎</button>
        <button class="act-btn" onclick="deleteTask(${t.id})">✕</button>
      </td>
    </tr>`).join('');
  attachRowDDs();
}

function renderEstimator(){
  const rem=tasks.filter(t=>t.status!=='已完成'&&t.status!=='取消');
  const mins=rem.reduce((a,t)=>a+t.est,0);
  document.getElementById('est-tasks').textContent=rem.length;
  document.getElementById('est-time').textContent=mins;
  document.getElementById('est-hrs').textContent=(mins/60).toFixed(1);
}

function changeStatus(id,val){const t=tasks.find(t=>t.id===id);if(t){t.status=val;render();}}
function changeScore(id,val){const t=tasks.find(t=>t.id===id);if(t){t.score=val;render();}}
function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);render();}

function openEdit(id){
  editId=id;
  const t=tasks.find(t=>t.id===id);
  document.getElementById('modal-title').textContent='// 編輯任務';
  setModalSubj(t.subj);
  setModalStatus(t.status);
  setModalScore(t.score||'');
  document.getElementById('f-name').value=t.name;
  document.getElementById('f-est').value=t.est;
  document.getElementById('f-actual').value=t.actual;
  document.getElementById('f-note').value=t.note||'';
  document.getElementById('modal-bg').classList.add('open');
}

document.getElementById('add-btn').onclick=()=>{
  editId=null;
  document.getElementById('modal-title').textContent='// 新增任務';
  setModalSubj(filterSubj||'國文');
  setModalStatus('未開始');
  setModalScore('');
  document.getElementById('f-name').value='';
  document.getElementById('f-est').value='';
  document.getElementById('f-actual').value='';
  document.getElementById('f-note').value='';
  document.getElementById('modal-bg').classList.add('open');
};

document.getElementById('modal-cancel').onclick=()=>document.getElementById('modal-bg').classList.remove('open');
document.getElementById('modal-bg').onclick=e=>{if(e.target===document.getElementById('modal-bg'))document.getElementById('modal-bg').classList.remove('open');};

document.getElementById('modal-save').onclick=()=>{
  const name=document.getElementById('f-name').value.trim();
  if(!name){document.getElementById('f-name').focus();return;}
  const data={subj:mSubj,name,est:parseInt(document.getElementById('f-est').value)||0,actual:parseInt(document.getElementById('f-actual').value)||0,status:mStatus,score:mScore,note:document.getElementById('f-note').value.trim()};
  if(editId){Object.assign(tasks.find(t=>t.id===editId),data);}
  else{tasks.push({id:Date.now(),...data});}
  document.getElementById('modal-bg').classList.remove('open');
  render();
};

document.getElementById('search-box').oninput=e=>{searchQ=e.target.value.toLowerCase();render();};
const notesArea=document.getElementById('notes-area');

let noteTimeout;
notesArea.oninput=()=>{
  notes=notesArea.value;
  clearTimeout(noteTimeout);
  noteTimeout=setTimeout(save, 500); 
};

initData();
</script>
</body>
</html>
